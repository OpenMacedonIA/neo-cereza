<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>NEO // FACE</title>

    <!-- Dependencias -->
    <script src="/static/js/socket.io.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --neon-color: #4ade80;
            --bracket-color: #4ade80;
            --bracket-length: clamp(40px, 7vw, 120px);
            --bracket-thickness: clamp(3px, 0.5vw, 6px);

            --wave-color: #4ade80;
            --wave-bars: 32;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
        }

        /* ── FULL-SCREEN FACE PANEL ── */
        .face-container {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(20px, 4vw, 56px);
            transition: all 0.3s ease;
        }

        /* Subtle radial glow in center */
        .face-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(74, 222, 128, 0.05) 0%, transparent 65%);
            pointer-events: none;
            transition: opacity 0.4s;
        }

        /* Extra glow when active */
        .face-container.listening::before,
        .face-container.speaking::before {
            background: radial-gradient(ellipse at 50% 40%, rgba(74, 222, 128, 0.10) 0%, transparent 60%);
        }

        /* ─── CORNER BRACKETS – L-shape via CSS borders ─── */
        .bracket {
            position: fixed;
            width: var(--bracket-length);
            height: var(--bracket-length);
            opacity: 0.85;
            filter: drop-shadow(0 0 8px var(--bracket-color));
            transition: all 0.3s ease;
        }

        .bracket-tl {
            top: clamp(16px, 3vw, 48px);
            left: clamp(16px, 3vw, 48px);
            border-top: var(--bracket-thickness) solid var(--bracket-color);
            border-left: var(--bracket-thickness) solid var(--bracket-color);
        }

        .bracket-tr {
            top: clamp(16px, 3vw, 48px);
            right: clamp(16px, 3vw, 48px);
            border-top: var(--bracket-thickness) solid var(--bracket-color);
            border-right: var(--bracket-thickness) solid var(--bracket-color);
        }

        .bracket-bl {
            bottom: clamp(16px, 3vw, 48px);
            left: clamp(16px, 3vw, 48px);
            border-bottom: var(--bracket-thickness) solid var(--bracket-color);
            border-left: var(--bracket-thickness) solid var(--bracket-color);
        }

        .bracket-br {
            bottom: clamp(16px, 3vw, 48px);
            right: clamp(16px, 3vw, 48px);
            border-bottom: var(--bracket-thickness) solid var(--bracket-color);
            border-right: var(--bracket-thickness) solid var(--bracket-color);
        }

        /* ─── EXPRESSION (eyes) ─── */
        #expression {
            color: var(--neon-color);
            font-size: clamp(60px, 14vw, 260px);
            font-weight: bold;
            text-shadow:
                0 0 20px var(--neon-color),
                0 0 50px var(--neon-color),
                0 0 90px rgba(74, 222, 128, 0.4);
            letter-spacing: clamp(10px, 3vw, 60px);
            transition: all 0.25s ease-in-out;
            white-space: pre;
            position: relative;
            z-index: 1;
        }

        /* ─── TERMINAL TEXT MODE ─── */
        #terminal-text {
            color: var(--neon-color);
            font-size: clamp(13px, 1.5vw, 22px);
            line-height: 1.6;
            text-shadow: 0 0 6px var(--neon-color);
            position: absolute;
            top: clamp(60px, 8vw, 140px);
            left: clamp(60px, 8vw, 140px);
            right: clamp(60px, 8vw, 140px);
            bottom: clamp(60px, 8vw, 140px);
            overflow: hidden;
            display: none;
            word-wrap: break-word;
            opacity: 0.85;
            z-index: 1;
        }

        /* ─── SOUND WAVE VISUALIZER ─── */
        #wave-visualizer {
            display: none;
            align-items: flex-end;
            justify-content: center;
            gap: clamp(2px, 0.4vw, 6px);
            height: clamp(50px, 8vw, 120px);
            width: clamp(180px, 35vw, 600px);
            z-index: 2;
            position: relative;
        }

        #wave-visualizer.visible {
            display: flex;
        }

        .wave-bar {
            flex: 1;
            background: var(--wave-color);
            border-radius: 3px 3px 2px 2px;
            min-height: 4px;
            max-height: 100%;
            box-shadow: 0 0 6px var(--wave-color);
            transform-origin: bottom center;
            transition: height 0.06s ease;
        }

        /* ─── STATE LABEL ─── */
        #state-label {
            font-size: clamp(9px, 1.2vw, 16px);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(74, 222, 128, 0.5);
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.3);
            position: absolute;
            bottom: clamp(28px, 5vw, 70px);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            transition: opacity 0.4s;
            opacity: 0;
            z-index: 2;
        }

        #state-label.visible {
            opacity: 1;
        }

        /* ─── WEBUI BUTTON ─── */
        #webui-btn {
            position: fixed;
            top: clamp(12px, 2.5vw, 36px);
            right: clamp(80px, 12vw, 180px);
            /* leave space away from bracket corner */
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(74, 222, 128, 0.35);
            border-radius: 4px;
            color: rgba(74, 222, 128, 0.7);
            font-family: monospace;
            font-size: clamp(10px, 1.1vw, 14px);
            letter-spacing: 0.1em;
            text-decoration: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s, opacity 0.4s;
            opacity: 0.55;
        }

        #webui-btn:hover {
            opacity: 1;
            color: var(--neon-color);
            border-color: rgba(74, 222, 128, 0.8);
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
        }

        #webui-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        /* ─── ANIMATIONS ─── */
        @keyframes pulse {
            0% {
                text-shadow: 0 0 15px var(--neon-color);
            }

            50% {
                text-shadow: 0 0 40px var(--neon-color), 0 0 80px var(--neon-color);
            }

            100% {
                text-shadow: 0 0 15px var(--neon-color);
            }
        }

        @keyframes bracketPulse {
            0% {
                opacity: 0.85;
                filter: drop-shadow(0 0 6px var(--bracket-color));
            }

            50% {
                opacity: 1;
                filter: drop-shadow(0 0 18px var(--bracket-color));
            }

            100% {
                opacity: 0.85;
                filter: drop-shadow(0 0 6px var(--bracket-color));
            }
        }

        @keyframes bracketSpeaking {
            0% {
                opacity: 1;
                filter: drop-shadow(0 0 12px var(--bracket-color));
            }

            50% {
                opacity: 0.6;
                filter: drop-shadow(0 0 4px var(--bracket-color));
            }

            100% {
                opacity: 1;
                filter: drop-shadow(0 0 12px var(--bracket-color));
            }
        }

        /* Thinking dots bounce */
        @keyframes dotBounce {

            0%,
            80%,
            100% {
                transform: scaleY(0.4);
                opacity: 0.4;
            }

            40% {
                transform: scaleY(1.2);
                opacity: 1;
            }
        }

        .thinking #expression {
            animation: pulse 1.2s infinite alternate;
        }

        .thinking .bracket {
            animation: bracketPulse 1.2s infinite alternate;
        }

        .listening .bracket {
            animation: bracketPulse 0.8s infinite alternate;
        }

        .speaking .bracket {
            animation: bracketSpeaking 0.5s infinite ease-in-out;
        }

        /* ─ EASTER EGG: Notas musicales ─────────────────────────── */
        @keyframes noteFloat {
            0%   { transform: translateY(0)   translateX(0)   rotate(0deg)  scale(1);   opacity: 1; }
            40%  { transform: translateY(-60px) translateX(var(--nx)) rotate(var(--nr)) scale(1.2); opacity: 0.9; }
            100% { transform: translateY(-160px) translateX(var(--nx2)) rotate(calc(var(--nr)*2)) scale(0.6); opacity: 0; }
        }
        .music-note {
            position: fixed;
            font-size: clamp(22px, 4vw, 52px);
            pointer-events: none;
            animation: noteFloat var(--nd, 1.4s) ease-out forwards;
            z-index: 50;
            filter: drop-shadow(0 0 8px currentColor);
        }
        /* Cara cuando hay música */
        .face-container.music-egg #expression {
            animation: pulse 0.6s infinite alternate;
            color: #f472b6;
            text-shadow: 0 0 20px #f472b6, 0 0 60px #f472b6;
        }
        .face-container.music-egg .bracket {
            border-color: #f472b6;
            filter: drop-shadow(0 0 14px #f472b6);
        }
    </style>
</head>

<body>

    <!-- Corner Brackets -->
    <div class="bracket bracket-tl"></div>
    <div class="bracket bracket-tr"></div>
    <div class="bracket bracket-bl"></div>
    <div class="bracket bracket-br"></div>

    <!-- WebUI link button -->
    <a id="webui-btn" href="/dashboard" title="Abrir WebUI">
        <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M3 4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4zm0 6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6zm8 0a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-6z" />
        </svg>
        WEBUI
    </a>

    <div class="face-container" id="face">

        <!-- Expression Display -->
        <div id="expression">^ ^</div>

        <!-- Sound Wave Visualizer (listening / speaking) -->
        <div id="wave-visualizer">
            <!-- bars injected by JS -->
        </div>

        <!-- Terminal Text Display (hidden by default) -->
        <div id="terminal-text"></div>

    </div>

    <!-- State label (bottom center) -->
    <div id="state-label"></div>

    <script>
        // ─── Config ───────────────────────────────────────────
        const N_BARS = 32;
        const IDLE_HEIGHT_PCT = 0.04; // resting bar height as fraction of visualizer

        const expressions = {
            'idle': '^ ^',
            'love': '♥ ♥',
            'winking': '− ^',
            'surprised': 'O O',
            'thinking': '~ ~',
            'sad': '; _ ;',
            'angry': '> _ <',
            'mischievous': '¬ ‿ ¬',
            'speaking': '· ‿ ·',
            'listening': '- -'
        };

        // ─── DOM Refs ─────────────────────────────────────────
        const expressionEl = document.getElementById('expression');
        const faceEl = document.getElementById('face');
        const terminalEl = document.getElementById('terminal-text');
        const waveEl = document.getElementById('wave-visualizer');
        const stateLabelEl = document.getElementById('state-label');

        // ─── Build Wave Bars ──────────────────────────────────
        const bars = [];
        for (let i = 0; i < N_BARS; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = '4px';
            waveEl.appendChild(bar);
            bars.push(bar);
        }

        // ─── Wave Animation State ─────────────────────────────
        let waveAnimId = null;
        let currentMode = 'idle'; // 'idle' | 'listening' | 'speaking'

        function startWave(mode) {
            currentMode = mode;
            waveEl.classList.add('visible');

            if (waveAnimId) return; // already running

            const totalH = waveEl.clientHeight || 100;

            function tick() {
                bars.forEach((bar, i) => {
                    let pct;
                    if (mode === 'listening') {
                        // Random mic-style noise, higher bars in center
                        const centerBias = 1 - Math.abs((i / N_BARS) - 0.5) * 1.2;
                        pct = (Math.random() * 0.55 + 0.08) * Math.max(0.2, centerBias);
                    } else if (mode === 'speaking') {
                        // Smoother sine-like talking wave
                        const t = Date.now() / 1000;
                        const centerBias = 1 - Math.abs((i / N_BARS) - 0.5) * 1.4;
                        pct = (0.35 + 0.45 * Math.abs(Math.sin(t * 4 + i * 0.4))) * Math.max(0.1, centerBias);
                    } else {
                        pct = IDLE_HEIGHT_PCT;
                    }
                    bar.style.height = Math.max(4, pct * totalH) + 'px';
                });
                waveAnimId = requestAnimationFrame(tick);
            }
            tick();
        }

        function stopWave() {
            if (waveAnimId) {
                cancelAnimationFrame(waveAnimId);
                waveAnimId = null;
            }
            waveEl.classList.remove('visible');
            bars.forEach(b => b.style.height = '4px');
            currentMode = 'idle';
        }

        // ─── State Label ──────────────────────────────────────
        let labelTimer = null;
        function showLabel(text, durationMs) {
            stateLabelEl.textContent = text;
            stateLabelEl.classList.add('visible');
            if (labelTimer) clearTimeout(labelTimer);
            if (durationMs) {
                labelTimer = setTimeout(() => stateLabelEl.classList.remove('visible'), durationMs);
            }
        }
        function hideLabel() {
            if (labelTimer) clearTimeout(labelTimer);
            stateLabelEl.classList.remove('visible');
        }

        // ─── Expression Setter ────────────────────────────────
        function setExpression(state) {
            faceEl.className = 'face-container'; // reset classes
            terminalEl.style.display = 'none';
            expressionEl.style.display = 'block';
            stopWave();
            hideLabel();

            if (state === 'terminal' || state === 'executing') {
                expressionEl.style.display = 'none';
                terminalEl.style.display = 'block';
                return;
            }

            // Wave states
            if (state === 'listening') {
                expressionEl.textContent = expressions['listening'];
                faceEl.classList.add('listening');
                startWave('listening');
                showLabel('ESCUCHANDO');
                return;
            }

            if (state === 'speaking') {
                expressionEl.textContent = expressions['speaking'];
                faceEl.classList.add('speaking');
                startWave('speaking');
                showLabel('HABLANDO');
                return;
            }

            if (state === 'thinking') {
                expressionEl.textContent = expressions['thinking'];
                faceEl.classList.add('thinking');
                showLabel('PROCESANDO');
                return;
            }

            if (expressions[state]) {
                expressionEl.textContent = expressions[state];
            } else {
                expressionEl.textContent = expressions['idle'];
            }
        }

        // ─── Terminal ─────────────────────────────────────────
        let terminalLines = [];
        function addTerminalLine(text) {
            terminalLines.push(text);
            if (terminalLines.length > 10) terminalLines.shift();
            terminalEl.innerHTML = terminalLines.join('<br>') + '<br>_';
        }

        // ─── Socket ───────────────────────────────────────────
        const socketUrl = "{{ socket_url }}" || undefined;
        const socket = io(socketUrl, {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: Infinity
        });

        socket.on('connect', () => {
            console.log('Connected to NeoCore');
            setExpression('idle');
        });

        socket.on('disconnect', () => {
            console.warn('Disconnected');
            setExpression('sad');
        });

        socket.on('face_update', (data) => {
            const state = data.state;
            if (state === 'user_detected') {
                setExpression('surprised');
                setTimeout(() => setExpression('idle'), 2000);
            } else if (state === 'listening') {
                setExpression('listening');
            } else if (state === 'speaking') {
                setExpression('speaking');
            } else if (state === 'music_egg') {
                triggerMusicEgg();
            } else {
                setExpression(state);
            }
        });

        // ── EASTER EGG: Notas Musicales ──────────────────────────────
        const NOTES = ['\u266a', '\u266b', '\u266c', '\u2669', '\u266d', '\uD83C\uDFB5', '\uD83C\uDFB6'];
        const NOTE_COLORS = ['#f472b6','#a78bfa','#34d399','#fbbf24','#60a5fa','#fb923c'];
        let musicEggTimer = null;

        function triggerMusicEgg() {
            // Cambiar expresión a cara cantando
            faceEl.className = 'face-container music-egg';
            expressionEl.textContent = '\u266a \u266b';
            showLabel('\uD83C\uDFB5 DETECTANDO MÚSICA \uD83C\uDFB5', 4000);

            // Lanzar notas en oleadas
            const origin = expressionEl.getBoundingClientRect();
            const cx = origin.left + origin.width / 2;
            const cy = origin.top + origin.height / 2;

            let launched = 0;
            const maxNotes = 18;
            const interval = setInterval(() => {
                if (launched >= maxNotes) { clearInterval(interval); return; }
                spawnNote(cx, cy);
                launched++;
            }, 120);

            // Volver a idle después de 4s
            if (musicEggTimer) clearTimeout(musicEggTimer);
            musicEggTimer = setTimeout(() => {
                faceEl.className = 'face-container';
                setExpression('idle');
            }, 4200);
        }

        function spawnNote(cx, cy) {
            const note = document.createElement('span');
            note.className = 'music-note';
            note.textContent = NOTES[Math.floor(Math.random() * NOTES.length)];
            const color = NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)];
            note.style.color = color;

            // Posición inicial alrededor de la "boca" (bajo los ojos)
            const spread = 80;
            const startX = cx + (Math.random() - 0.5) * spread;
            const startY = cy + 40 + Math.random() * 30;
            note.style.left = startX + 'px';
            note.style.top  = startY + 'px';

            // Variables CSS para la trayectoria aleatoria
            const nx  = (Math.random() - 0.5) * 120;
            const nx2 = nx + (Math.random() - 0.5) * 60;
            const nr  = (Math.random() - 0.5) * 40 + 'deg';
            const nd  = (1.1 + Math.random() * 0.8) + 's';
            note.style.setProperty('--nx',  nx  + 'px');
            note.style.setProperty('--nx2', nx2 + 'px');
            note.style.setProperty('--nr',  nr);
            note.style.setProperty('--nd',  nd);

            document.body.appendChild(note);
            // Limpiar elemento después de la animación
            note.addEventListener('animationend', () => note.remove());
        }

        socket.on('emotion_update', (data) => {
            const emotion = data.emotion;
            setExpression(emotion);
            if (data.temp !== false) {
                setTimeout(() => setExpression('idle'), 3000);
            }
        });

        socket.on('command:execution', (data) => {
            setExpression('terminal');
            addTerminalLine(`> Executing: ${data.cmd}`);
            setTimeout(() => {
                if (terminalEl.style.display === 'block') {
                    setExpression('idle');
                }
            }, 5000);
        });

        socket.on('command:output', (data) => {
            if (terminalEl.style.display === 'none') {
                setExpression('terminal');
            }
            const lines = data.output.split('\n');
            lines.forEach(l => { if (l.trim()) addTerminalLine(l); });
            setTimeout(() => setExpression('idle'), 4000);
        });

        socket.on('log_message', (data) => {
            if (terminalEl.style.display === 'block') {
                addTerminalLine(data.msg);
            }
        });

        // ═══════════════════════════════════════════════════════════
        //  VOZ DESDE NAVEGADOR — Browser Mic → PCM16 → /api/voice/audio
        // ═══════════════════════════════════════════════════════════
        const TARGET_RATE = 16000;
        const FRAME_SIZE = 2048;
        const SILENCE_GRACE = 900;   // ms de silencio para cortar
        const MIN_AUDIO_MS = 250;   // duración mínima que vale la pena enviar

        let audioCtx = null;
        let sourceNode = null;
        let processorNode = null;
        let analyserNode = null;
        let mediaStream = null;
        let isRecording = false;
        let pcmChunks = [];
        let silenceTimer = null;
        let recordStart = 0;
        let vadActive = false;
        let vadThreshold = 6; // % RMS — ajustar si hay ruido ambiente

        // ── Botón mic (esquina inferior derecha, semitransparente) ──
        const micBtnFace = document.createElement('button');
        micBtnFace.id = 'mic-face-btn';
        micBtnFace.innerHTML = '🎙';
        micBtnFace.title = 'Toca para hablar con Neo';
        Object.assign(micBtnFace.style, {
            position: 'fixed',
            bottom: 'clamp(28px, 5vw, 60px)',
            right: 'clamp(28px, 5vw, 60px)',
            width: '54px', height: '54px',
            borderRadius: '50%',
            border: '1px solid rgba(74,222,128,0.35)',
            background: 'rgba(0,0,0,0.55)',
            color: 'rgba(74,222,128,0.7)',
            fontSize: '22px',
            cursor: 'pointer',
            zIndex: '20',
            backdropFilter: 'blur(6px)',
            transition: 'all 0.25s',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            opacity: '0.5',
        });
        document.body.appendChild(micBtnFace);

        // Hover
        micBtnFace.addEventListener('mouseenter', () => micBtnFace.style.opacity = '1');
        micBtnFace.addEventListener('mouseleave', () => {
            if (!isRecording) micBtnFace.style.opacity = '0.5';
        });

        function setMicState(state) {
            // state: 'idle' | 'recording' | 'processing'
            if (state === 'recording') {
                micBtnFace.innerHTML = '⏹';
                micBtnFace.style.opacity = '1';
                micBtnFace.style.borderColor = 'rgba(239,68,68,0.8)';
                micBtnFace.style.color = 'rgba(239,68,68,0.9)';
                micBtnFace.style.boxShadow = '0 0 18px rgba(239,68,68,0.4)';
            } else if (state === 'processing') {
                micBtnFace.innerHTML = '⌛';
                micBtnFace.style.opacity = '1';
                micBtnFace.style.borderColor = 'rgba(251,191,36,0.8)';
                micBtnFace.style.color = 'rgba(251,191,36,0.9)';
                micBtnFace.style.boxShadow = '0 0 18px rgba(251,191,36,0.3)';
            } else {
                micBtnFace.innerHTML = '🎙';
                micBtnFace.style.opacity = '0.5';
                micBtnFace.style.borderColor = 'rgba(74,222,128,0.35)';
                micBtnFace.style.color = 'rgba(74,222,128,0.7)';
                micBtnFace.style.boxShadow = 'none';
            }
        }

        // ── Click en el botón o en la cara para activar/desactivar ──
        micBtnFace.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMic();
        });
        // Clic en la pantalla (fuera del botón webui) también activa
        document.getElementById('face').addEventListener('click', () => toggleMic());

        async function toggleMic() {
            if (isRecording) {
                stopRecording(true);
            } else {
                await startRecording();
            }
        }

        // ── SocketIO: cuando Neo responde → cambiar cara ──────────
        socket.on('stt:result', (data) => {
            // Texto reconocido → cara pensando
            setExpression('thinking');
        });
        socket.on('ai:response', (data) => {
            // Respuesta de Neo → volver a idle después de speaking
            // (face_update ya gestiona speaking, pero por si acaso)
            setTimeout(() => setExpression('idle'), 200);
        });

        // ── Audio pipeline ────────────────────────────────────────
        async function startRecording() {
            if (isRecording) return;

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.error('mediaDevices API not available (requires HTTPS)');
                setExpression('sad');
                showLabel('HTTPS / CERT REQUERIDO', 4000);
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                console.error('Mic error:', err);
                setExpression('sad');
                if (err.name === 'NotAllowedError') {
                    showLabel('PERMISO DENEGADO', 3000);
                } else {
                    showLabel('SIN MICRÓFONO', 3000);
                }
                return;
            }

            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TARGET_RATE });
            sourceNode = audioCtx.createMediaStreamSource(mediaStream);
            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 512;
            processorNode = audioCtx.createScriptProcessor(FRAME_SIZE, 1, 1);

            sourceNode.connect(analyserNode);
            sourceNode.connect(processorNode);
            processorNode.connect(audioCtx.destination);

            pcmChunks = [];
            isRecording = true;
            vadActive = false;
            recordStart = Date.now();
            clearSilTimer();

            processorNode.onaudioprocess = onAudioProcess;

            setExpression('listening');
            setMicState('recording');
            showLabel('ESCUCHANDO');

            // Alimentar la ola con los datos reales del micro
            animateRealWave();
        }

        let realWaveRaf = null;
        function animateRealWave() {
            if (!analyserNode) return;
            const buf = new Uint8Array(analyserNode.frequencyBinCount);
            const totalH = waveEl.clientHeight || 80;
            waveEl.classList.add('visible');

            function tick() {
                if (!isRecording) { stopWave(); return; }
                analyserNode.getByteTimeDomainData(buf);
                bars.forEach((bar, i) => {
                    // Mapear muestra PCM a altura
                    const idx = Math.floor(i * buf.length / bars.length);
                    const v = Math.abs((buf[idx] / 128.0) - 1.0); // 0..1
                    bar.style.height = Math.max(4, v * totalH * 1.6) + 'px';
                });
                realWaveRaf = requestAnimationFrame(tick);
            }
            tick();
        }

        function onAudioProcess(e) {
            const f32 = e.inputBuffer.getChannelData(0);
            let sum = 0;
            for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
            const rms = Math.sqrt(sum / f32.length) * 100;

            pcmChunks.push(float32ToInt16(f32));

            // VAD
            if (rms > vadThreshold) {
                vadActive = true;
                clearSilTimer();
            } else if (vadActive) {
                schedSilence();
            }
        }

        function schedSilence() {
            if (silenceTimer) return;
            silenceTimer = setTimeout(() => {
                silenceTimer = null;
                if (isRecording) stopRecording(true);
            }, SILENCE_GRACE);
        }
        function clearSilTimer() {
            if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
        }

        function stopRecording(send = false) {
            if (!isRecording) return;
            isRecording = false;
            vadActive = false;
            clearSilTimer();
            if (realWaveRaf) { cancelAnimationFrame(realWaveRaf); realWaveRaf = null; }

            if (processorNode) { processorNode.disconnect(); processorNode.onaudioprocess = null; }
            if (sourceNode) sourceNode.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            processorNode = sourceNode = analyserNode = mediaStream = audioCtx = null;

            const elapsed = Date.now() - recordStart;

            if (send && pcmChunks.length && elapsed >= MIN_AUDIO_MS) {
                setExpression('thinking');
                setMicState('processing');
                showLabel('PROCESANDO');
                sendAudio(pcmChunks);
            } else {
                setExpression('idle');
                setMicState('idle');
                hideLabel();
            }
            pcmChunks = [];
        }

        async function sendAudio(chunks) {
            const total = chunks.reduce((a, c) => a + c.length, 0);
            const pcm = new Int16Array(total);
            let off = 0;
            for (const c of chunks) { pcm.set(c, off); off += c.length; }

            const bytes = new Uint8Array(pcm.buffer);
            const b64 = uint8ToB64(bytes);
            const csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';

            try {
                const resp = await fetch('/api/voice/audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                    body: JSON.stringify({ audio: b64, rate: TARGET_RATE })
                });
                const json = await resp.json();
                if (json.status !== 'ok') {
                    console.error('voice/audio error:', json);
                    setExpression('sad');
                    showLabel('ERROR: ' + (json.message || '?'), 3000);
                    setMicState('idle');
                }
                // Si ok: el STT emitirá stt:result → face_update:thinking → face_update:speaking
            } catch (err) {
                console.error('sendAudio fetch error:', err);
                setExpression('sad');
                showLabel('SIN CONEXION', 3000);
                setMicState('idle');
            }
        }

        // ── Helpers ───────────────────────────────────────────────
        function float32ToInt16(f32) {
            const out = new Int16Array(f32.length);
            for (let i = 0; i < f32.length; i++) {
                const s = Math.max(-1, Math.min(1, f32[i]));
                out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return out;
        }

        function uint8ToB64(u8) {
            let bin = '';
            for (let i = 0; i < u8.byteLength; i++) bin += String.fromCharCode(u8[i]);
            return btoa(bin);
        }

        // ── CSRF token: face.html no extiende base.html, lo obtenemos del servidor
        // Si no hay meta tag, el endpoint /api/voice/audio necesita el token por cookie.
        // Lo añadimos como meta tag dinámico al cargar.
        fetch('/api/audio/status').then(r => {
            // Este fetch hace que Flask envíe la cookie de sesión con el CSRF.
            // No necesitamos hacer nada más — el token está en la cookie del proxy Flask.
        }).catch(() => { });

    </script>
</body>
