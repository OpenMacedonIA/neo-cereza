<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO // FACE</title>

    <!-- Dependencias -->
    <script src="/static/js/socket.io.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1a1a;
            --face-bg: #000000;
            --neon-color: #4ade80; /* Mint Green */
            --bracket-color: #4ade80;
            --face-shine: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
        }

        .face-container {
            width: 400px;
            height: 250px;
            background-color: var(--face-bg);
            border-radius: 125px; /* Oval shape */
            position: relative;
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(74, 222, 128, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #0f0f0f;
            overflow: hidden; /* For terminal text */
            transition: all 0.3s ease;
        }

        /* Glossy shine effect on the glass screen */
        .face-container::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 40%;
            background: linear-gradient(to bottom, var(--face-shine), transparent);
            border-radius: 100px 100px 0 0;
            pointer-events: none;
        }

        /* Terminal Brackets [ ] */
        .bracket {
            position: absolute;
            color: var(--bracket-color);
            font-size: 40px;
            font-weight: bold;
            opacity: 0.8;
            text-shadow: 0 0 10px var(--bracket-color);
        }

        .bracket-tl { top: 20px; left: 40px; }
        .bracket-tr { top: 20px; right: 40px; }
        .bracket-bl { bottom: 20px; left: 40px; }
        .bracket-br { bottom: 20px; right: 40px; }

        /* The Expression Text */
        #expression {
            color: var(--neon-color);
            font-size: 80px;
            font-weight: bold;
            text-shadow: 0 0 15px var(--neon-color), 0 0 30px var(--neon-color);
            letter-spacing: 10px;
            transition: all 0.2s ease-in-out;
            white-space: pre; /* to preserve spaces */
        }

        /* Terminal Mode Styling */
        #terminal-text {
            color: var(--neon-color);
            font-size: 14px;
            text-shadow: 0 0 5px var(--neon-color);
            position: absolute;
            top: 20px;
            left: 40px;
            right: 40px;
            bottom: 20px;
            overflow: hidden;
            display: none;
            word-wrap: break-word;
            opacity: 0.8;
        }

        /* Animations */
        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--neon-color); }
            50% { text-shadow: 0 0 25px var(--neon-color), 0 0 40px var(--neon-color); }
            100% { text-shadow: 0 0 10px var(--neon-color); }
        }

        .thinking #expression {
            animation: pulse 1s infinite alternate;
        }
        
    </style>
</head>
<body>

    <div class="face-container" id="face">
        <!-- Corner Brackets -->
        <div class="bracket bracket-tl">┌</div>
        <div class="bracket bracket-tr">┐</div>
        <div class="bracket bracket-bl">└</div>
        <div class="bracket bracket-br">┘</div>

        <!-- Expression Display -->
        <div id="expression">^ ^</div>
        
        <!-- Terminal Text Display (Hidden by default) -->
        <div id="terminal-text"></div>
    </div>


    <script>
        // Expression Dictionary
        const expressions = {
            'idle': '^ ^',           // 1. Standard Happy
            'love': '♥ ♥',           // 2. Love/Adoration
            'winking': '− ^',        // 3. Winking/Playful
            'surprised': 'O O',      // 4. Surprised/Wow  (user_detected / alert)
            'thinking': '...',       // 5. Thinking/Loading
            'sad': '; _ ;',          // 7. Sad/Concerned (error)
            'angry': '> _ <',        // 8. Angry/Determined
            'mischievous': '¬ ‿ ¬',  // 9. Mischievous/Hacker
            'speaking': '− ‿ −'      // custom speaking mouth
        };

        const expressionEl = document.getElementById('expression');
        const faceEl = document.getElementById('face');
        const terminalEl = document.getElementById('terminal-text');

        function setExpression(state) {
            faceEl.className = 'face-container'; // reset classes
            terminalEl.style.display = 'none';
            expressionEl.style.display = 'block';

            if (state === 'terminal' || state === 'executing') {
                // 6. Terminal/SysAdmin Mode
                expressionEl.style.display = 'none';
                terminalEl.style.display = 'block';
                return;
            }

            if (expressions[state]) {
                expressionEl.textContent = expressions[state];
                if (state === 'thinking') {
                    faceEl.classList.add('thinking');
                }
            } else {
                expressionEl.textContent = expressions['idle'];
            }
        }

        // Simular logs de terminal para el modo SysAdmin
        let terminalLines = [];
        function addTerminalLine(text) {
            terminalLines.push(text);
            if (terminalLines.length > 10) terminalLines.shift();
            terminalEl.innerHTML = terminalLines.join('<br>') + '<br>_';
        }

        // Conectar Socket a NeoCore
        const socketUrl = "{{ socket_url }}" || undefined;
        const socket = io(socketUrl, {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: Infinity
        });

        socket.on('connect', () => {
            console.log('Connected to NeoCore');
            setExpression('idle');
        });

        socket.on('disconnect', () => {
            console.warn('Disconnected');
            setExpression('sad');
        });

        // Eventos Principales del Rostro
        socket.on('face_update', (data) => {
            const state = data.state; // 'listening', 'speaking', 'thinking', 'idle', 'user_detected'
            
            if (state === 'user_detected') {
                setExpression('surprised');
                setTimeout(() => setExpression('idle'), 2000);
            } else if (state === 'listening') {
                setExpression('winking');
            } else {
                setExpression(state);
            }
        });

        // Eventos Secundarios para otras emociones
        socket.on('emotion_update', (data) => {
            // Permite inyectar emociones específicas: 'love', 'angry', 'mischievous', 'sad'
            const emotion = data.emotion;
            setExpression(emotion);
            
            // Volver a idle después de unos segundos a menos que sea un estado persistente
            if (data.temp !== false) {
                 setTimeout(() => setExpression('idle'), 3000);
            }
        });

        // Capturar ejecución de comandos para el Modo Terminal (6)
        socket.on('command:execution', (data) => {
            setExpression('terminal');
            addTerminalLine(`> Executing: ${data.cmd}`);
            
            // Volver a idle despues de un tiempo simulado si no hay respuesta
            setTimeout(() => {
                if(faceEl.className.includes('face-container') && terminalEl.style.display === 'block'){
                    setExpression('idle');
                }
            }, 5000);
        });

        socket.on('command:output', (data) => {
             if(terminalEl.style.display === 'none') {
                 setExpression('terminal');
             }
             const lines = data.output.split('\n');
             lines.forEach(l => {
                 if(l.trim()) addTerminalLine(l);
             });
             
             // Volver a idle después de mostrar la salida
             setTimeout(() => setExpression('idle'), 4000);
        });
        
        // Log simple para ver que pasa en el server si el terminal esta activo
        socket.on('log_message', (data) => {
            if(terminalEl.style.display === 'block') {
                addTerminalLine(data.msg);
            }
        });

    </script>
</body>
</html>
